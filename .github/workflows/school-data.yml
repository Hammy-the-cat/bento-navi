name: Update school data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 1 * *' # Monthly source check, 04:17 JST on the 2nd.
  push:
    branches: [main]
    paths:
      - '.github/workflows/school-data.yml'
      - 'tool/school_data/**'
permissions:
  contents: read
concurrency:
  group: school-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.40,<2'
      - run: python -m unittest discover -s tool/school_data -p 'test_*.py'
      - run: python tool/school_data/build.py
      - name: Verify and publish schools independently
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: bento-navi-shop-data
          AWS_ACCESS_KEY_ID: ${{ secrets.SHOP_DATA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHOP_DATA_R2_SECRET_ACCESS_KEY }}
        run: python tool/school_data/publish.py --folder build/schools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-data-audit
          path: |
            build/schools/manifest.json
            build/schools/audit.json
          retention-days: 90
